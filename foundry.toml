[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
# Avalanche C-Chain (mainnet 43114 and Fuji 43113) executes Cancun opcodes (PUSH0, MCOPY, TSTORE);
# checked with eth_call on both networks on 1 Oct 2026. It does not yet know the Osaka CLZ opcode.
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
fuzz = { runs = 1000 }

[lint]
# The mock token intentionally mirrors FiatToken's public names (name, symbol, DOMAIN_SEPARATOR).
exclude_lints = ["mixed-case-function", "screaming-snake-case-const"]

[rpc_endpoints]
avalanche = "https://api.avax.network/ext/bc/C/rpc"
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
local = "http://127.0.0.1:8545"
